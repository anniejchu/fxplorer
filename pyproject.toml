[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fxplorer"
version = "0.0.0"

[tool.setuptools]
py-modules = ["backend"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fxplorer*"]

[tool.setuptools.package-data]
"fxplorer.configs" = ["examples/*.yaml"]
