experiment_name: "perceptual_groups"

audio:
  dry_audio_path: "assets/salsa_piano.wav"
  normalize_dry: true
  normalize_output: true
  target_lufs: -14

sample_generation:
  include_dry: true
  num_samples_per_manual_chain: 25
  num_samples_per_random_chain: 0

manual_chains:
  clean_enhance:
    description: "Mild EQ + gentle compression"
    chain: ["eq:6", "compressor"]
    apply_rand_params: true
    param_overrides:
      eq:
        "bands.0.gain_db": { min: -2.0, max: 2.0 }
        "bands.1.gain_db": { min: -2.0, max: 2.0 }
        "bands.2.gain_db": { min: -2.0, max: 2.0 }
        "bands.3.gain_db": { min: -2.0, max: 2.0 }
        "bands.4.gain_db": { min: -2.0, max: 2.0 }
        "bands.5.gain_db": { min: -2.0, max: 2.0 }
        "bands.0.q": { min: 0.4, max: 1.2 }
        "bands.1.q": { min: 0.4, max: 1.2 }
        "bands.2.q": { min: 0.4, max: 1.2 }
        "bands.3.q": { min: 0.4, max: 1.2 }
        "bands.4.q": { min: 0.4, max: 1.2 }
        "bands.5.q": { min: 0.4, max: 1.2 }
      compressor:
        threshold_db: { min: -18.0, max: -10.0 }
        ratio: { min: 1.5, max: 3.0 }
        attack_ms: { min: 5.0, max: 25.0 }
        release_ms: { min: 80.0, max: 250.0 }

  bright_presence:
    description: "High-mid and air boosts"
    chain: ["eq:6"]
    apply_rand_params: true
    param_overrides:
      eq:
        "bands.0.gain_db": { min: -2.0, max: 2.0 }
        "bands.1.gain_db": { min: -2.0, max: 2.0 }
        "bands.2.gain_db": { min: -1.0, max: 2.0 }
        "bands.3.gain_db": { min: 3.0, max: 10.0 }
        "bands.4.gain_db": { min: 4.0, max: 12.0 }
        "bands.5.gain_db": { min: 3.0, max: 10.0 }
        "bands.3.q": { min: 0.6, max: 2.5 }
        "bands.4.q": { min: 0.6, max: 2.5 }
        "bands.5.q": { min: 0.6, max: 2.5 }

  dark_muffled:
    description: "Lowpass plus low-mid dips"
    chain: ["lowpass", "eq:6"]
    apply_rand_params: true
    param_overrides:
      lowpass:
        cutoff_hz: { min: 400.0, max: 2500.0 }
      eq:
        "bands.0.gain_db": { min: -8.0, max: -2.0 }
        "bands.1.gain_db": { min: -10.0, max: -3.0 }
        "bands.2.gain_db": { min: -8.0, max: -2.0 }
        "bands.3.gain_db": { min: -6.0, max: -1.0 }
        "bands.4.gain_db": { min: -6.0, max: -1.0 }
        "bands.5.gain_db": { min: -6.0, max: -1.0 }
        "bands.0.q": { min: 0.4, max: 1.4 }
        "bands.1.q": { min: 0.4, max: 1.4 }
        "bands.2.q": { min: 0.4, max: 1.4 }
        "bands.3.q": { min: 0.4, max: 1.4 }
        "bands.4.q": { min: 0.4, max: 1.4 }
        "bands.5.q": { min: 0.4, max: 1.4 }

  space_depth_subtle:
    description: "Reverb + delay for depth (subtle)"
    chain: ["reverb", "delay"]
    apply_rand_params: true
    param_overrides:
      reverb:
        room_size: { min: 0.15, max: 0.45 }
        damping: { min: 0.25, max: 0.7 }
        wet_level: { min: 0.1, max: 0.35 }
        dry_level: { min: 0.6, max: 1.0 }
        width: { min: 0.6, max: 1.0 }
      delay:
        delay_seconds: { min: 0.03, max: 0.2 }
        feedback: { min: 0.05, max: 0.35 }
        mix: { min: 0.1, max: 0.35 }

  space_depth_lush:
    description: "Reverb + delay for depth (lush)"
    chain: ["reverb", "delay"]
    apply_rand_params: true
    param_overrides:
      reverb:
        room_size: { min: 0.45, max: 0.95 }
        damping: { min: 0.1, max: 0.6 }
        wet_level: { min: 0.35, max: 0.8 }
        dry_level: { min: 0.3, max: 0.8 }
        width: { min: 0.6, max: 1.0 }
      delay:
        delay_seconds: { min: 0.2, max: 0.9 }
        feedback: { min: 0.2, max: 0.75 }
        mix: { min: 0.25, max: 0.65 }

  motion_subtle:
    description: "Chorus + phaser movement (subtle)"
    chain: ["chorus", "phaser"]
    apply_rand_params: true
    param_overrides:
      chorus:
        rate_hz: { min: 0.1, max: 1.5 }
        depth: { min: 0.15, max: 0.5 }
        centre_delay_ms: { min: 3.0, max: 8.0 }
        feedback: { min: 0.0, max: 0.35 }
        mix: { min: 0.15, max: 0.45 }
      phaser:
        rate_hz: { min: 0.1, max: 2.0 }
        depth: { min: 0.15, max: 0.5 }
        centre_frequency_hz: { min: 300.0, max: 1500.0 }
        feedback: { min: 0.0, max: 0.4 }
        mix: { min: 0.15, max: 0.5 }

  motion_lush:
    description: "Chorus + phaser movement (lush)"
    chain: ["chorus", "phaser"]
    apply_rand_params: true
    param_overrides:
      chorus:
        rate_hz: { min: 0.6, max: 4.0 }
        depth: { min: 0.5, max: 0.9 }
        centre_delay_ms: { min: 6.0, max: 15.0 }
        feedback: { min: 0.2, max: 0.7 }
        mix: { min: 0.4, max: 0.8 }
      phaser:
        rate_hz: { min: 0.4, max: 5.0 }
        depth: { min: 0.4, max: 0.9 }
        centre_frequency_hz: { min: 200.0, max: 2200.0 }
        feedback: { min: 0.2, max: 0.7 }
        mix: { min: 0.35, max: 0.85 }

  grit_lofi:
    description: "Distortion + filtering for grit"
    chain: ["distortion", "lowpass"]
    apply_rand_params: true
    param_overrides:
      distortion:
        drive_db: { min: 10.0, max: 32.0 }
      lowpass:
        cutoff_hz: { min: 800.0, max: 6000.0 }

  transient_control:
    description: "Compression + limiting"
    chain: ["compressor", "limiter"]
    apply_rand_params: true
    param_overrides:
      compressor:
        threshold_db: { min: -30.0, max: -10.0 }
        ratio: { min: 4.0, max: 12.0 }
        attack_ms: { min: 1.0, max: 15.0 }
        release_ms: { min: 50.0, max: 250.0 }
      limiter:
        threshold_db: { min: -10.0, max: -3.0 }
        release_ms: { min: 20.0, max: 120.0 }

random_chains: {}
param_sweeps: {}
